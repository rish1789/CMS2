name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale jobs - $0 budget
# means not burning free-tier minutes on runs nobody will look at.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java / Gradle)
    runs-on: ubuntu-latest
    # `secrets` is not allowed in step-level `if:` (GitHub rejects the whole workflow), so expose
    # only whether the key is configured - never the key itself - to the conditions below.
    env:
      HAS_NVD_API_KEY: ${{ secrets.NVD_API_KEY != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco/test/html

      - name: Cache OWASP Dependency-Check NVD database
        if: ${{ env.HAS_NVD_API_KEY == 'true' }}
        uses: actions/cache@v4
        with:
          path: backend/.dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      # The NVD has required an API key for reliable data access since Feb 2023 - without
      # one, the scan fails outright (confirmed 2026-09-15: "Invalid API Key, length of 0"),
      # not just slowly. Skip gracefully with a warning until NVD_API_KEY is configured as a
      # repo secret (free: https://nvd.nist.gov/developers/request-an-api-key), rather than
      # permanently failing every build with no way to merge.
      - name: Dependency vulnerability scan (OWASP Dependency-Check)
        if: ${{ env.HAS_NVD_API_KEY == 'true' }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Dependency vulnerability scan skipped (no NVD_API_KEY secret)
        if: ${{ env.HAS_NVD_API_KEY != 'true' }}
        run: |
          echo "::warning::Skipping OWASP Dependency-Check - no NVD_API_KEY repository secret configured. Add one (free, from https://nvd.nist.gov/developers/request-an-api-key) under Settings > Secrets and variables > Actions to enable this gate."

      - name: Upload dependency-check report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check-report
          path: backend/build/reports/dependency-check-report.html

  frontend:
    name: Frontend (TypeScript / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Dependency audit (fails only on high/critical)
        run: npm audit --audit-level=high

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm run test
