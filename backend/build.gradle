plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.cms'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    testcontainersVersion = "2.0.5"
}

dependencies {
    // Spring Boot 4 split auto-configuration into per-technology modules: webmvc is the
    // servlet-web starter, and Flyway's auto-configuration (which runs the migrations at
    // startup) now lives in its own starter - flyway-core alone would no longer migrate.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // T001 (002-patient-account-login): JWT issuance/validation for the patient-scoped session token.
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Interactive OpenAPI/Swagger docs (served at /docs, raw spec at /api-docs - see
    // application.yml's springdoc.* properties and com.cms.common.OpenApiConfig).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4: @WebMvcTest/@AutoConfigureMockMvc live in the webmvc test module, and
    // spring-security-test's MockMvc integration comes with the security test starter.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    finalizedBy jacocoTestReport
}

// Jacoco: coverage REPORTING only, per 044-ci-quality-gates FR-004 — deliberately no
// jacocoTestCoverageVerification rule. Most modules have no unit-test layer yet (see
// 045-backend-unit-test-backfill), so gating on a coverage percentage now would just be
// gating on a number no one can move yet.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// OWASP Dependency-Check: fails only on High/Critical (CVSS >= 7), per
// 044-ci-quality-gates research.md Decision 1. An NVD API key (free, from
// https://nvd.nist.gov/developers/request-an-api-key) dramatically speeds up the
// vulnerability-database sync and avoids aggressive rate limiting — optional locally,
// but should be set as a repository secret (NVD_API_KEY) in CI.
dependencyCheck {
    failBuildOnCVSS = 7.0
    nvd {
        if (System.getenv('NVD_API_KEY')) {
            apiKey = System.getenv('NVD_API_KEY')
        }
    }
    analyzers {
        assemblyEnabled = false
    }
    // Explicit, stable path so CI can cache the NVD database between runs instead of
    // re-syncing it (which can take several minutes, longer without an NVD_API_KEY).
    data {
        directory = "${rootProject.projectDir}/.dependency-check-data"
    }
}

spotless {
    java {
        target 'src/**/*.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        indentWithSpaces(4)
        endWithNewline()
    }
}

compileJava.dependsOn 'spotlessApply'
